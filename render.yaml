# Render Blueprint — wire up during Hrs 0–2 of the hackathon.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: zeyla-api
    runtime: node
    plan: starter
    # Single service: builds the whole workspace from the root (the lockfile only
    # exists there, and @zeyla/shared has to compile before either app) and the
    # API process serves apps/web/dist alongside /api on one origin.
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zeyla-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: zeyla-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: FAL_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADDIS_AI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      # VITE_* are read by Vite at build time and baked into the bundle, so they
      # belong to this service now that it builds the frontend too. VITE_API_URL
      # is this service's own public origin.
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_CHAPA_PUBLIC_KEY
        sync: false

  # Render Key Value (Valkey, Redis-compatible). Empty ipAllowList = reachable
  # only from inside the Render network, which is all the API needs.
  - type: keyvalue
    name: zeyla-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: zeyla-postgres
    plan: basic-256mb
    databaseName: zeyla
    user: zeyla
    # Enable PostGIS via Render dashboard / SQL after first provision:
    # CREATE EXTENSION IF NOT EXISTS postgis;
